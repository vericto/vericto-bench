#
# Every component of a run, pinned. Images by digest (the digest is what is
# pulled; the tag is a label for humans). Read by host/pull-images.sh, the
# Makefile and runner/run.py, and copied into every run's manifest.json.
#
# Official Docker images (library/*) can be pulled from a mirror with the same
# digest: LIBRARY_MIRROR=public.ecr.aws/docker/library (the default on EC2,
# where Docker Hub's anonymous pull limit is shared by many hosts). A digest
# identifies the image whatever the registry.

# --- System under test --------------------------------------------------------
# BENCH-2026-11 measures vericto-proxy 4.14.2 (chosen on 2026-10-19 as the
# latest release). 4.14.2 is documentation-only over 4.14.1 (same code, engine
# v4.3.0, 42 built-in rules); the code's default log filter is still
# info,vericto_proxy=debug, so the harness sets RUST_LOG=info explicitly.
# runner/run.py refuses profile=published unless the tag equals PUBLISHED_PROXY_VERSION.
VERICTO_PROXY_IMAGE=docker.io/vericto/vericto-proxy:4.14.2@sha256:0446e4357183cf676461c2eac42377d0e331ad19d044d12cde1045608785eb6b
VERICTO_PROXY_MIRROR=ghcr.io/vericto/vericto-proxy
PUBLISHED_PROXY_VERSION=4.14.2
# The engine the proxy pins (vericto-proxy Cargo.toml): engine-eval and the stub's rules use the same tag.
VERICTO_ENGINE_TAG=v4.3.0
# Release comparisons (suite [variant.*] targets; never profile=published). Same
# digests on GHCR (VERICTO_PROXY_MIRROR). 4.14.3 changes only the code's default
# log filter (the harness sets RUST_LOG=info anyway); 4.15.0 pins engine v4.4.0,
# whose 42 built-in rules and evaluate() are unchanged, and adds
# VERICTO_POLICY_RULES (default off).
VERICTO_PROXY_4_14_3_IMAGE=docker.io/vericto/vericto-proxy:4.14.3@sha256:66fa5e986f2b63089c5bcf07324bc2a0501920e6d180997c04d0526cf75c7354
VERICTO_PROXY_4_15_0_IMAGE=docker.io/vericto/vericto-proxy:4.15.0@sha256:f4fd543e764204162a04320feefa54e52ac3a1670ea3d8419d32987f70d75124
# 4.15.3: less CPU per statement (telemetry serialization); the baseline of the tail-latency investigation.
VERICTO_PROXY_4_15_3_IMAGE=docker.io/vericto/vericto-proxy:4.15.3@sha256:e543749208dbc485de08d139de6b4e7c82fd29f227c6b1b52a7ec7b0669667cf

