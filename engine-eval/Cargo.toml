#
# This crate's own code is Apache-2.0. It links vericto-engine, which is
# FSL-1.1-ALv2: a built engine-eval binary contains FSL code, and the FSL's terms
# apply to that part (see THIRD_PARTY.md).
[package]
name = "engine-eval"
version = "0.2.0"
edition = "2021"
publish = false
license = "Apache-2.0"

# The engine tag the measured proxy pins (vericto-proxy 4.14.x: v4.3.0, 42 rules),
# so evaluation-only figures, the stub's rules and the proxy agree by construction.
[dependencies]
vericto-engine = { git = "https://github.com/vericto/vericto-engine", tag = "v4.3.0" }
serde_json = "1"

[profile.release]
debug = false
codegen-units = 1
