#
# Tier P cross-check on c7i.2xlarge (x86, SMT): saturation and the headline PG curve.
# Generated by suites/generate.py from the design's matrix (BENCH-2026-11 section 10).
# Pre-registered: do not edit between the start of a campaign and its report.

[suite]
name = "published-c7i"
profile = "published"
order_seed = 2026111903
reps = 3
warmup_s = 60
duration_s = 300
cooldown_s = 30
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

# P-sat: closed-loop saturation, W1 select-only extended, TLS, 0.5 vCPU
[[curve]]
id = "sat-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "pgbouncer-session", "vericto-offline", "vericto-enforce", "vericto-observe"]
loop = "closed"
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
warmup_s = 30
duration_s = 120
reps = 1

# P-head-pg: HEADLINE PG curve, W1 pgbench select-only, extended protocol, TLS, 0.5 vCPU
[[curve]]
id = "head-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [10, 30, 50, 70, 80, 90, 100]
saturation_from = "sat-pg-w1-05"
conns = 64
