#
# Release gate of vericto-proxy 4.17.1, policies off, stack B of two (stack A:
# suites/proxy-4171-gate-a.toml, which carries the full header): PostgreSQL W1
# with pgbench -M simple and -M prepared, and MySQL W3 (unchanged by #89: a
# sanity check), at 0.5 vCPU. Same targets, decision rule and pre-registered S
# (PostgreSQL W1 6,032.6/s, MySQL W3 356.6/s) as stack A. Not published.
#
# Fixed before the run:
# - sat-*: closed loop at 16 and 64 connections, 3 repetitions (TPS);
# - gate-pg-simple-05 / gate-pg-prep-05: 30, 50 and 80% of S;
#   gate-my-w3-05: 50, 80 and 90% of S; 15 s warm-up, 60 s measured,
#   5 repetitions, a Williams order of the four targets per (rep, rate);
# - prof-pg-prep-4170 / -4171: one profiled cell each (perf record 20 s at 50%
#   of S), after the gate curves; not gated.

[suite]
name = "proxy-4171-gate-b"
profile = "quick"
order_seed = 2026102402
reps = 5
warmup_s = 15
duration_s = 60
cooldown_s = 10
interval_s = 10
saturation_target = "vericto-enforce-4170"

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[variant.vericto-enforce-4162]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_16_2_IMAGE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.16.2, VERICTO_POLICY_RULES=off"

[variant.vericto-enforce-4170]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_17_0_IMAGE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.17.0, VERICTO_POLICY_RULES=off"

[variant.vericto-enforce-4171]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.17.1 candidate (77ff155), VERICTO_POLICY_RULES=off"

[[curve]]
id = "sat-pg-simple-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "simple"
tls = true
size = "0.5"
targets = ["vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
loop = "closed"
concurrency = [16, 64]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "sat-pg-prep-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
size = "0.5"
targets = ["vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
loop = "closed"
concurrency = [16, 64]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "sat-my-w3-05"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
loop = "closed"
concurrency = [16, 64]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "gate-pg-simple-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "simple"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [30, 50, 80]
saturation_qps = 6032.6

[[curve]]
id = "gate-pg-prep-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [30, 50, 80]
saturation_qps = 6032.6

[[curve]]
id = "gate-my-w3-05"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [50, 80, 90]
saturation_qps = 356.6

[[curve]]
id = "prof-pg-prep-4170"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
size = "0.5"
targets = ["vericto-enforce-4170"]
rates_pct = [50]
saturation_qps = 6032.6
duration_s = 40
reps = 1
profile_s = 20

[[curve]]
id = "prof-pg-prep-4171"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
