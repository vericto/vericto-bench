#
# Tier P day 2: the headline curves again on a freshly launched SUT, at day 1's absolute rates.
# saturation_qps is day 1's S (suites/generate.py DAY1_S, from run bench-2026-11-p2-day1); with
# 0 the suite refuses to run. Run with: terraform apply -var suite=day2 (records day 2).
# Generated by suites/generate.py from the design's matrix (BENCH-2026-11 section 10).
# Pre-registered: do not edit between the start of a campaign and its report.

[suite]
name = "published-day2"
profile = "published"
order_seed = 2026111902
reps = 3
warmup_s = 60
duration_s = 300
cooldown_s = 30
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

# P-head-pg: HEADLINE PG curve, W1 pgbench select-only, extended protocol, TLS, 0.5 vCPU
[[curve]]
id = "head-pg-w1-05-day2"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [10, 30, 50, 70, 80, 90, 100]
saturation_from = ""
conns = 64
saturation_qps = 6032.566666666667

# P-head-my: HEADLINE MySQL curve, W3 oltp_read_only (vbench replay, text protocol), TLS, 0.5 vCPU
[[curve]]
id = "head-my-w3-05-day2"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [10, 30, 50, 70, 80, 90, 100]
saturation_from = ""
saturation_qps = 356.59166666666664
