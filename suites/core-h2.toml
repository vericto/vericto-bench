#
# BENCH-2026-11 day 1, core cut (2026-10-20, METHODOLOGY.md section 11): the PG two-task curve.
# Runs on its own stack after head-pg-w1-05 and head-my-w3-05 of published.toml, at
# day 1's S_0.5 (DAY1_S), so 30% and 90% are the 1x0.5 curve's absolute rates and
# 120-220% show whether two tasks of 0.5 vCPU scale (an earlier Fargate measurement
# saw PG with two tasks saturate below one task, cause unexplained). Its own SUT host, so it also runs 1 x 0.5 at
# 30, 90 and 120% for a same-host comparison. Runs after head-my-w3-05 (combined traffic caps).
# Generated by suites/generate.py from the campaign matrix (METHODOLOGY.md section 11).
# Pre-registered: do not edit between the start of a campaign and its report.

[suite]
name = "core-h2"
profile = "published"
order_seed = 2026112001
reps = 3
warmup_s = 60
duration_s = 300
cooldown_s = 30
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

# P-2tasks core: 2 x 0.5 vCPU vericto-enforce vs direct, PG W1 extended, TLS
[[curve]]
id = "h2-pg-w1-2x05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "2x0.5"
targets = ["direct", "vericto-enforce"]
rates_pct = [30, 60, 90, 120, 150, 180, 220]
saturation_qps = 6032.566666666667
conns = 128

# Same host, 1 x 0.5 vCPU, the same absolute rates up to past one task's saturation
[[curve]]
id = "h2-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce"]
rates_pct = [30, 90, 120]
saturation_qps = 6032.566666666667
conns = 128
