#
# P1 dry run (about 1 hour): checks provenance, cpusets, caps and the analysis on EC2. Not published.
# Generated by suites/generate.py from the design's matrix (BENCH-2026-11 section 10).
# Pre-registered: do not edit between the start of a campaign and its report.

[suite]
name = "quick"
profile = "quick"
order_seed = 2026111900
reps = 1
warmup_s = 15
duration_s = 60
cooldown_s = 10
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[engine_eval]
sizes = ["0.5", "1"]
iters = 20000
budget_s = 20
min_iters = 1000


# P-sat: closed-loop saturation, W1 select-only extended, TLS, 0.5 vCPU
[[curve]]
id = "sat-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce"]
loop = "closed"
concurrency = [1, 4, 16, 64]
warmup_s = 10
duration_s = 30
reps = 1

# P-sat: closed-loop saturation, W3 oltp_read_only replay (text), TLS, 0.5 vCPU
[[curve]]
id = "sat-my-w3-05"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce"]
loop = "closed"
concurrency = [1, 4, 16, 64]
warmup_s = 10
duration_s = 30
reps = 1

# P-head-pg: HEADLINE PG curve, W1 pgbench select-only, extended protocol, TLS, 0.5 vCPU
[[curve]]
id = "head-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [30, 70, 100]
saturation_from = "sat-pg-w1-05"
conns = 64

# P-head-my: HEADLINE MySQL curve, W3 oltp_read_only (vbench replay, text protocol), TLS, 0.5 vCPU
[[curve]]
id = "head-my-w3-05"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [30, 70, 100]
saturation_from = "sat-my-w3-05"

[[curve]]
id = "bytes-pg-payload-100k"
engine = "pg"
tool = "vbench"
workload = "payload-100k"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce"]
rates = [50]

[[curve]]
id = "size-pg-batch1000-1"
engine = "pg"
tool = "vbench"
workload = "batch1000"
mode = "extended"
tls = true
size = "1"
targets = ["direct", "vericto-enforce"]
rates = [10]
conns = 1

[[curve]]
id = "validate-generator-pg"
engine = "pg"
tool = "vbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct"]
rates = [500]
pause_every_s = 20
pause_s = 1
