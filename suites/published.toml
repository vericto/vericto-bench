#
# Tier P published campaign, day 1 (c7g.2xlarge SUT + c7g.xlarge load generator, two-host).
# Generated by suites/generate.py from the campaign matrix (METHODOLOGY.md section 11).
# Pre-registered: do not edit between the start of a campaign and its report.

[suite]
name = "published-day1"
profile = "published"
order_seed = 2026111901
reps = 3
warmup_s = 60
duration_s = 300
cooldown_s = 30
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[engine_eval]
sizes = ["0.5", "1"]
iters = 20000
budget_s = 20
min_iters = 1000


# P-sat: closed-loop saturation, W1 select-only extended, TLS, 0.5 vCPU
[[curve]]
id = "sat-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "pgbouncer-session", "vericto-offline", "vericto-enforce", "vericto-observe"]
loop = "closed"
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
warmup_s = 30
duration_s = 120
reps = 1

# P-sat: closed-loop saturation, W3 oltp_read_only replay (text), TLS, 0.5 vCPU
[[curve]]
id = "sat-my-w3-05"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "proxysql", "vericto-offline", "vericto-enforce", "vericto-observe"]
loop = "closed"
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
warmup_s = 30
duration_s = 120
reps = 1

