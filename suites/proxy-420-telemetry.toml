#
# Release gate of the vericto-proxy 4.20.0 candidate (4.19.0's CPU work, PR #95,
# + 4.20.0's parser-version warning + patch 0072; tree 26c4e770) against 4.18.0
# (current Latest; the acceptance baseline), with the candidate built twice from
# the same tree: plain (no PGO, PROXY_IMAGE_OVERRIDE_2) and PGO-trained as
# release.yml does (PROXY_IMAGE_OVERRIDE). Not published.
#
# Fixed before the run: S pre-registered as in proxy-tail and the 4.17.x gates
# (PostgreSQL W1 6,032.6/s, MySQL W3 356.6/s), other curves at fixed rates or at
# a share of this run's closed-loop S of 4.18.0; a Williams order per
# (repetition, rate). Decision (owner, 2026-10-28): CPU per transaction no worse
# than 4.18.0 in any cell; p99 at 80/90% of S no worse than 4.18.0 + 0.05 ms; no
# collapse at 90% of S on one core; PGO kept only if cheaper than plain.
#
# Stack C1: sanitized query telemetry (cpstub telemetry_query_mode "sanitized",
# API key *-san) at the 0.5x2c Fargate shape: PostgreSQL W1 extended at 50% of S
# (5 x 60 s) and at 80/90% of S (4 x 120 s); MySQL W3 text at 50/80% of S
# (4 x 60 s). The PGO candidate runs twice: with the deferred event build (the
# default) and with VERICTO_TELEMETRY_BUILD_QUEUE=0.

[suite]
name = "proxy-420-telemetry"
profile = "quick"
order_seed = 2026102805
reps = 5
warmup_s = 15
duration_s = 60
cooldown_s = 10
interval_s = 10
saturation_target = "vericto-san-4180"

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[variant.vericto-san-4180]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_18_0_IMAGE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-pg-san" }
label = "4.18.0, sanitized telemetry (pg)"

[variant.vericto-san-plain]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE_2"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-pg-san" }
label = "candidate without PGO, sanitized telemetry (pg)"

[variant.vericto-san-pgo]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-pg-san" }
label = "candidate with PGO, sanitized telemetry (pg), deferred build (default)"

[variant.vericto-san-pgo-bq0]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-pg-san", VERICTO_TELEMETRY_BUILD_QUEUE = "0" }
label = "candidate with PGO, sanitized telemetry (pg), VERICTO_TELEMETRY_BUILD_QUEUE=0 (built on the query path)"

[variant.vericto-msan-4180]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_18_0_IMAGE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-mysql-san" }
label = "4.18.0, sanitized telemetry (mysql)"

[variant.vericto-msan-plain]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE_2"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-mysql-san" }
label = "candidate without PGO, sanitized telemetry (mysql)"

[variant.vericto-msan-pgo]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-mysql-san" }
label = "candidate with PGO, sanitized telemetry (mysql), deferred build (default)"

[variant.vericto-msan-pgo-bq0]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off", VERICTO_API_KEY = "enforce-mysql-san", VERICTO_TELEMETRY_BUILD_QUEUE = "0" }
label = "candidate with PGO, sanitized telemetry (mysql), VERICTO_TELEMETRY_BUILD_QUEUE=0 (built on the query path)"

[[curve]]
id = "gate-pg-ext-fg-san"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5x2c"
targets = ["direct", "vericto-san-4180", "vericto-san-plain", "vericto-san-pgo", "vericto-san-pgo-bq0"]
rates_pct = [50]
saturation_qps = 6032.6

[[curve]]
id = "knee-pg-ext-fg-san"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5x2c"
targets = ["direct", "vericto-san-4180", "vericto-san-plain", "vericto-san-pgo", "vericto-san-pgo-bq0"]
rates_pct = [80, 90]
saturation_qps = 6032.6
warmup_s = 30
duration_s = 120
reps = 4

[[curve]]
id = "gate-my-w3-fg-san"
engine = "mysql"
tool = "vbench"
workload = "sysbench-ro"
mode = "text"
tls = true
size = "0.5x2c"
targets = ["direct", "vericto-msan-4180", "vericto-msan-plain", "vericto-msan-pgo", "vericto-msan-pgo-bq0"]
rates_pct = [50, 80]
saturation_qps = 356.6
reps = 4
