#
# Release gate of vericto-proxy 4.17.1 (PR #89, merge 77ff155: ordered PostgreSQL
# response coordinator, marker Query / invalid Parse for local replies, prepared
# re-evaluation at Bind/Execute), policies off, against 4.16.2 (the fix of the
# 4.15.x tail) and 4.17.0 (Latest, the parent of #89). Stack A of two (same
# hosts and harness; stack B: suites/proxy-4171-gate-b.toml): PostgreSQL W1,
# extended protocol, at 0.5 vCPU and 0.5x2c (the 0.5 quota over two cores, as on
# a 0.5 vCPU Fargate task: where 4.15.x had its +39 ms p99 at 80% of S). Not
# published.
#
# Fixed before the run:
# - S pre-registered as in proxy-tail: BENCH-2026-11 day 1, PostgreSQL W1
#   6,032.6/s, so 80% of S is the absolute rate that exposed the tail
#   (4,826/s);
# - targets: direct, 4.16.2, 4.17.0 by digest (versions.lock) and the 4.17.1
#   candidate built from 77ff155 with the proxy's Dockerfile (linux/arm64),
#   from a bench-only registry (PROXY_IMAGE_OVERRIDE), all three with
#   VERICTO_POLICY_RULES=off;
# - sat-pg-ext-05: closed loop at 1/4/16/64 connections, 3 repetitions (TPS);
# - gate-pg-ext-05: 30 and 50% of S, 15 s warm-up, 60 s measured, 5 reps
#   (the M2 gate timing);
# - knee-pg-ext-05 (70/80/90%) and knee-pg-ext-fg (0.5x2c, 80/90%): 30 s
#   warm-up, 120 s measured, 4 reps (the proxy-tail timing);
# - a Williams order of the four targets per (repetition, rate), rates shuffled
#   with the seed;
# - prof-pg-ext-4170 / -4171: one profiled cell each (perf record 20 s at 50%
#   of S), after the gate curves; not gated (profiler overhead).
# Decision rule (analysis/ab.py, paired difference 4.17.1 minus baseline per
# repetition, Student t 95% interval), as in m2-fix-ab: 4.17.1 passes a cell
# when the interval of p50, p99 and CPU/tx includes 0 or lies below it, against
# 4.16.2 and against 4.17.0; and no cell at 80/90% of S shows a quota tail
# (added p99 over direct of more than 5 ms where the baselines have less).

[suite]
name = "proxy-4171-gate-a"
profile = "quick"
order_seed = 2026102401
reps = 5
warmup_s = 15
duration_s = 60
cooldown_s = 10
interval_s = 10
saturation_target = "vericto-enforce-4170"

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[variant.vericto-enforce-4162]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_16_2_IMAGE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.16.2, VERICTO_POLICY_RULES=off"

[variant.vericto-enforce-4170]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_17_0_IMAGE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.17.0, VERICTO_POLICY_RULES=off"

[variant.vericto-enforce-4171]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.17.1 candidate (77ff155), VERICTO_POLICY_RULES=off"

[[curve]]
id = "sat-pg-ext-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
loop = "closed"
concurrency = [1, 4, 16, 64]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "gate-pg-ext-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [30, 50]
saturation_qps = 6032.6

[[curve]]
id = "knee-pg-ext-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [70, 80, 90]
saturation_qps = 6032.6
warmup_s = 30
duration_s = 120
reps = 4

[[curve]]
id = "knee-pg-ext-fg"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5x2c"
targets = ["direct", "vericto-enforce-4162", "vericto-enforce-4170", "vericto-enforce-4171"]
rates_pct = [80, 90]
saturation_qps = 6032.6
warmup_s = 30
duration_s = 120
reps = 4

[[curve]]
id = "prof-pg-ext-4170"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["vericto-enforce-4170"]
rates_pct = [50]
saturation_qps = 6032.6
duration_s = 40
reps = 1
profile_s = 20

[[curve]]
id = "prof-pg-ext-4171"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["vericto-enforce-4171"]
rates_pct = [50]
saturation_qps = 6032.6
duration_s = 40
reps = 1
profile_s = 20
