#
# vericto-proxy 4.17.2 with business policies ON (VERICTO_POLICY_RULES=enforce),
# against 4.17.0 with policies on and against 4.17.2 with policies off. Stack C of
# three of the 4.17.2 release gate (A, B: proxy-4172-gate-{a,b}.toml). Not gated:
# it measures what #89 adds by design while business policies are active (every
# Execute of a prepared statement is evaluated again, so a policy that reads
# time.now cannot keep a Parse-time allow), which 4.17.0 does not do. Not
# published.
#
# The control-plane stub signs every bundle with an Ed25519 key it generates in
# memory for this run (cpstub -sign; never a Vericto key) and the proxies trust
# only that key (VERICTO_BUNDLE_SIGNING_KEYS from the stub's /signing-keys); a
# cell whose proxy did not apply a verified bundle is aborted. To a proxy that
# announces cel/1 the bundle adds one business policy and one principal
# (configs/cpstub/policy-rules.json, principals.json): pgbench's database user
# `bench` is the service principal `pgbench`, and its reads of
# public.pgbench_accounts are refused only on Wednesdays 03:00-03:01 UTC
# (in_window(time.now, ...)): evaluated on every statement, never refusing one
# during the run.
#
# Fixed before the run: S as in the gate (PostgreSQL W1 6,032.6/s); 0.5 vCPU,
# TLS on both legs; open loop at 30 and 50% of S, 5 repetitions x 60 s (15 s
# warm-up), a Williams order per (repetition, rate); closed loop at 16
# connections, 3 repetitions.

[suite]
name = "proxy-4172-policies"
profile = "quick"
order_seed = 2026102503
reps = 5
warmup_s = 15
duration_s = 60
cooldown_s = 10
interval_s = 10
saturation_target = "vericto-pol-4170"

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

[variant.vericto-pol-4170]
base = "vericto-enforce"
image = "VERICTO_PROXY_4_17_0_IMAGE"
env = { VERICTO_POLICY_RULES = "enforce" }
label = "4.17.0, VERICTO_POLICY_RULES=enforce"

[variant.vericto-pol-4172]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "enforce" }
label = "4.17.2 candidate, VERICTO_POLICY_RULES=enforce"

[variant.vericto-enforce-4172]
base = "vericto-enforce"
image = "PROXY_IMAGE_OVERRIDE"
env = { VERICTO_POLICY_RULES = "off" }
label = "4.17.2 candidate, VERICTO_POLICY_RULES=off"

[[curve]]
id = "sat-pg-ext-pol"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["vericto-pol-4170", "vericto-pol-4172", "vericto-enforce-4172"]
loop = "closed"
concurrency = [16]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "sat-pg-prep-pol"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
size = "0.5"
targets = ["vericto-pol-4170", "vericto-pol-4172", "vericto-enforce-4172"]
loop = "closed"
concurrency = [16]
warmup_s = 10
duration_s = 30
reps = 3

[[curve]]
id = "pol-pg-ext-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "vericto-pol-4170", "vericto-pol-4172", "vericto-enforce-4172"]
rates_pct = [30, 50]
saturation_qps = 6032.6

[[curve]]
id = "pol-pg-prep-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "prepared"
tls = true
size = "0.5"
targets = ["direct", "vericto-pol-4170", "vericto-pol-4172", "vericto-enforce-4172"]
rates_pct = [30, 50]
saturation_qps = 6032.6
