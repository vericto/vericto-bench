#
# Refresh of the published BENCH-2026-11 figures for vericto-proxy 4.21.0 (owner request
# 2026-10-31), PostgreSQL stack. The day-1 core of suites/published.toml, as BENCH-2026-11
# ran it for 4.14.2 (METHODOLOGY.md section 11): closed-loop saturation (S = the maximum of
# vericto-enforce at 0.5 vCPU, TLS), the generator validation, and the headline curve at
# 10-100% of S against direct and HAProxy TCP, 3 interleaved repetitions of 300 s.
# Budget trim of this refresh: the saturation curve runs vericto-enforce only (S is its
# maximum; the other targets' closed loops are not published).
# Pre-registered: do not edit between the start of the run and its report.

[suite]
name = "pub421-day1-pg"
profile = "published"
order_seed = 2026103101
reps = 3
warmup_s = 60
duration_s = 300
cooldown_s = 30
interval_s = 10

[datasets]
pgbench_scale = 100
sysbench_tables = 8
sysbench_rows = 1000000
payload_rows = 10000

# P-sat: closed-loop saturation, W1 select-only extended, TLS, 0.5 vCPU
[[curve]]
id = "sat-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["vericto-enforce"]
loop = "closed"
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
warmup_s = 30
duration_s = 120
reps = 1

# Generator validation: the database paused 1 s once a minute; p99.9/max must show ~1 s and ~1% of requests above 500 ms
[[curve]]
id = "validate-generator-pg"
engine = "pg"
tool = "vbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct"]
rates = [1000]
pause_every_s = 60
pause_s = 1
reps = 2

# P-head-pg: HEADLINE PG curve, W1 pgbench select-only, extended protocol, TLS, 0.5 vCPU
[[curve]]
id = "head-pg-w1-05"
engine = "pg"
tool = "pgbench"
workload = "select-only"
mode = "extended"
tls = true
size = "0.5"
targets = ["direct", "haproxy-tcp", "vericto-enforce"]
rates_pct = [10, 30, 50, 70, 80, 90, 100]
saturation_from = "sat-pg-w1-05"
conns = 64
